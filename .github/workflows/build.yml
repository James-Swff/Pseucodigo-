          class DiamondClipper extends CustomClipper<Path> {
            @override
            Path getClip(Size size) {
              return Path()
                ..moveTo(size.width / 2, 0)
                ..lineTo(size.width, size.height / 2)
                ..lineTo(size.width / 2, size.height)
                ..lineTo(0, size.height / 2)
                ..close();
            }

            @override
            bool shouldReclip(covariant CustomClipper<Path> oldClipper) => false;
          }

          class DiamondBorderPainter extends CustomPainter {
            final Color color;
            DiamondBorderPainter({required this.color});

            @override
            void paint(Canvas canvas, Size size) {
              final paint = Paint()
                ..color = color
                ..strokeWidth = 2.0
                ..style = PaintingStyle.stroke;

              final path = Path()
                ..moveTo(size.width / 2, 0)
                ..lineTo(size.width, size.height / 2)
                ..lineTo(size.width / 2, size.height)
                ..lineTo(0, size.height / 2)
                ..close();

              canvas.drawPath(path, paint);
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldPainter) => false;
          }

          class ParallelogramClipper extends CustomClipper<Path> {
            @override
            Path getClip(Size size) {
              const slant = 18.0;
              return Path()
                ..moveTo(slant, 0)
                ..lineTo(size.width, 0)
                ..lineTo(size.width - slant, size.height)
                ..lineTo(0, size.height)
                ..close();
            }

            @override
            bool shouldReclip(covariant CustomClipper<Path> oldClipper) => false;
          }

          class ParallelogramBorderPainter extends CustomPainter {
            final Color color;
            ParallelogramBorderPainter({required this.color});

            @override
            void paint(Canvas canvas, Size size) {
              const slant = 18.0;
              final paint = Paint()
                ..color = color
                ..strokeWidth = 2.0
                ..style = PaintingStyle.stroke;

              final path = Path()
                ..moveTo(slant, 0)
                ..lineTo(size.width, 0)
                ..lineTo(size.width - slant, size.height)
                ..lineTo(0, size.height)
                ..close();

              canvas.drawPath(path, paint);
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldPainter) => false;
          }

          class TrapezoidClipper extends CustomClipper<Path> {
            @override
            Path getClip(Size size) {
              const slant = 18.0;
              return Path()
                ..moveTo(slant, 0)
                ..lineTo(size.width - slant, 0)
                ..lineTo(size.width, size.height)
                ..lineTo(0, size.height)
                ..close();
            }

            @override
            bool shouldReclip(covariant CustomClipper<Path> oldClipper) => false;
          }

          class TrapezoidBorderPainter extends CustomPainter {
            final Color color;
            TrapezoidBorderPainter({required this.color});

            @override
            void paint(Canvas canvas, Size size) {
              const slant = 18.0;
              final paint = Paint()
                ..color = color
                ..strokeWidth = 2.0
                ..style = PaintingStyle.stroke;

              final path = Path()
                ..moveTo(slant, 0)
                ..lineTo(size.width - slant, 0)
                ..lineTo(size.width, size.height)
                ..lineTo(0, size.height)
                ..close();

              canvas.drawPath(path, paint);
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldPainter) => false;
          }
