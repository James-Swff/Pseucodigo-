name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Crear estructura base
        run: flutter create --platforms=android .

      - name: Escribir codigo de la app
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';

          void main() {
            runApp(const PseudoCodeApp());
          }

          class PseudoCodeApp extends StatelessWidget {
            const PseudoCodeApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PseudoCode Studio Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF1E88E5),
                    brightness: Brightness.dark,
                  ),
                  scaffoldBackgroundColor: const Color(0xFF0D1117),
                  useMaterial3: true,
                ),
                home: const MainScreen(),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> with SingleTickerProviderStateMixin {
            late TabController _tabController;
            final TextEditingController _codeController = TextEditingController();
            final FocusNode _focusNode = FocusNode();

            double _fontSize = 14.0;
            final List<Map<String, String>> _consoleLogs = [];
            Map<String, dynamic> _memoryVariables = {};
            int _currentStepIndex = -1;
            List<String> _stepLines = [];

            final List<Map<String, String>> _savedAlgorithms = [
              {
                'title': '1. Suma de Dos Numeros',
                'level': 'Facil',
                'desc': 'Pide dos valores por teclado, los suma y muestra el resultado.',
                'code': """Algoritmo SumaSimple
            Definir a, b, res Como Entero;
            Escribir "Ingrese primer numero:";
            Leer a;
            Escribir "Ingrese segundo numero:";
            Leer b;
            res <- a + b;
            Escribir "La suma es:";
            Escribir res;
          FinAlgoritmo"""
              },
              {
                'title': '2. Mayor de Tres Numeros',
                'level': 'Intermedio',
                'desc': 'Evalua tres numeros con condicionales Si-Entonces anidados.',
                'code': """Algoritmo MayorDeTres
            Definir a, b, c Como Real;
            Escribir "Ingrese tres valores:";
            Leer a; Leer b; Leer c;
            Si a > b Y a > c Entonces
              Escribir "El mayor es A";
            SiNo
              Si b > c Entonces
                Escribir "El mayor es B";
              SiNo
                Escribir "El mayor es C";
              FinSi
            FinSi
          FinAlgoritmo"""
              }
            ];

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 4, vsync: this);
              _codeController.text = _savedAlgorithms[0]['code']!;
            }

            @override
            void dispose() {
              _tabController.dispose();
              _codeController.dispose();
              _focusNode.dispose();
              super.dispose();
            }

            void _insertText(String text, {int offset = 0}) {
              final currentText = _codeController.text;
              final selection = _codeController.selection;
              final start = selection.start >= 0 ? selection.start : currentText.length;
              final end = selection.end >= 0 ? selection.end : currentText.length;

              final newText = currentText.replaceRange(start, end, text);
              _codeController.value = TextEditingValue(
                text: newText,
                selection: TextSelection.collapsed(offset: start + text.length + offset),
              );
              _focusNode.requestFocus();
            }

            void _runAlgorithm() {
              setState(() {
                _consoleLogs.clear();
                _memoryVariables.clear();
                _currentStepIndex = -1;
                _consoleLogs.add({'type': 'sys', 'text': '--- INICIO DE EJECUCION ---'});
              });

              final lines = _codeController.text.split('\n');
              final Map<String, dynamic> vars = {};

              for (var rawLine in lines) {
                final line = rawLine.trim();
                if (line.isEmpty || line.startsWith('//') || line.startsWith('Algoritmo') || line.startsWith('FinAlgoritmo')) {
                  continue;
                }

                if (line.startsWith('Escribir')) {
                  var content = line.substring(8).trim();
                  if (content.endsWith(';')) content = content.substring(0, content.length - 1).trim();
                  if (content.startsWith('"') && content.endsWith('"')) {
                    content = content.substring(1, content.length - 1);
                    _consoleLogs.add({'type': 'out', 'text': content});
                  } else if (vars.containsKey(content)) {
                    _consoleLogs.add({'type': 'out', 'text': '${vars[content]}'});
                  } else {
                    _consoleLogs.add({'type': 'out', 'text': content});
                  }
                } else if (line.startsWith('Leer')) {
                  var varName = line.substring(4).trim();
                  if (varName.endsWith(';')) varName = varName.substring(0, varName.length - 1).trim();
                  vars[varName] = 16;
                  _consoleLogs.add({'type': 'in', 'text': '-> [$varName] = 16 (Entrada simulada)'});
                } else if (line.contains('<-')) {
                  final parts = line.split('<-');
                  final varName = parts[0].trim();
                  vars[varName] = 32;
                }
              }

              setState(() {
                _memoryVariables = vars;
                _consoleLogs.add({'type': 'sys', 'text': '--- EJECUCION FINALIZADA ---'});
                _tabController.animateTo(2);
              });
            }

            Future<void> _exportPdf() async {
              final pdf = pw.Document();
              final code = _codeController.text;

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.a4,
                  build: (pw.Context context) {
                    return pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: [
                        pw.Header(
                          level: 0,
                          child: pw.Row(
                            mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                            children: [
                              pw.Text('PseudoCode Pro', style: pw.TextStyle(fontSize: 18, fontWeight: pw.FontWeight.bold, color: PdfColors.blue800)),
                              pw.Text('by aethell_labs', style: const pw.TextStyle(fontSize: 12, color: PdfColors.blueGrey700)),
                            ],
                          ),
                        ),
                        pw.SizedBox(height: 12),
                        pw.Text('Codigo Fuente:', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 14)),
                        pw.SizedBox(height: 6),
                        pw.Container(
                          width: double.infinity,
                          padding: const pw.EdgeInsets.all(10),
                          decoration: pw.BoxDecoration(
                            color: PdfColors.grey100,
                            border: pw.Border.all(color: PdfColors.grey400),
                          ),
                          child: pw.Text(code, style: const pw.TextStyle(fontSize: 10)),
                        ),
                      ],
                    );
                  },
                ),
              );

              await Printing.layoutPdf(
                onLayout: (PdfPageFormat format) async => pdf.save(),
                name: 'Algoritmo_PSeInt.pdf',
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    mainAxisSize: MainAxisSize.min,
                    children: const [
                      Row(
                        children: [
                          Icon(Icons.terminal, color: Colors.blueAccent, size: 20),
                          SizedBox(width: 6),
                          Text('PseudoCode Pro', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                        ],
                      ),
                      Text('by aethell_labs', style: TextStyle(fontSize: 10, color: Colors.cyanAccent, letterSpacing: 0.8)),
                    ],
                  ),
                  actions: [
                    IconButton(
                      tooltip: 'Exportar PDF',
                      icon: const Icon(Icons.picture_as_pdf_rounded, color: Colors.orangeAccent),
                      onPressed: _exportPdf,
                    ),
                    IconButton(
                      tooltip: 'Ejecutar',
                      icon: const Icon(Icons.play_arrow_rounded, color: Colors.greenAccent, size: 30),
                      onPressed: _runAlgorithm,
                    ),
                  ],
                  bottom: TabBar(
                    controller: _tabController,
                    indicatorColor: Colors.blueAccent,
                    tabs: const [
                      Tab(icon: Icon(Icons.code), text: 'Editor'),
                      Tab(icon: Icon(Icons.schema_rounded), text: 'Diagrama'),
                      Tab(icon: Icon(Icons.dvr_rounded), text: 'Consola'),
                      Tab(icon: Icon(Icons.folder_open_rounded), text: 'Retos'),
                    ],
                  ),
                ),
                body: TabBarView(
                  controller: _tabController,
                  children: [
                    _buildEditorTab(),
                    _buildDiagramTab(),
                    _buildConsoleTab(),
                    _buildChallengesTab(),
                  ],
                ),
              );
            }

            Widget _buildEditorTab() {
              return Column(
                children: [
                  Expanded(
                    child: Container(
                      color: const Color(0xFF14181E),
                      padding: const EdgeInsets.all(12),
                      child: TextField(
                        controller: _codeController,
                        focusNode: _focusNode,
                        maxLines: null,
                        expands: true,
                        style: TextStyle(
                          fontFamily: 'monospace',
                          fontSize: _fontSize,
                          color: const Color(0xFFE2E8F0),
                        ),
                        decoration: const InputDecoration(
                          border: InputBorder.none,
                          hintText: 'Escribe tu algoritmo...',
                        ),
                      ),
                    ),
                  ),
                  _buildKeyboardToolbar(),
                ],
              );
            }

            Widget _buildKeyboardToolbar() {
              return Container(
                color: const Color(0xFF1A1F26),
                padding: const EdgeInsets.symmetric(vertical: 6, horizontal: 8),
                child: SingleChildScrollView(
                  scrollDirection: Axis.horizontal,
                  child: Row(
                    children: [
                      _shortcutButton('Si', () => _insertText('Si  Entonces\n\t\nFinSi', offset: -16)),
                      _shortcutButton('Para', () => _insertText('Para i <- 1 Hasta 10 Con Paso 1 Hacer\n\t\nFinPara', offset: -20)),
                      _shortcutButton('Escribir', () => _insertText('Escribir "";', offset: -2)),
                      _shortcutButton('Leer', () => _insertText('Leer ;', offset: -1)),
                      _shortcutButton('<-', () => _insertText(' <- ')),
                      _shortcutButton(';', () => _insertText(';')),
                    ],
                  ),
                ),
              );
            }

            Widget _shortcutButton(String label, VoidCallback onTap) {
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 3),
                child: ElevatedButton(
                  style: ElevatedButton.styleFrom(
                    backgroundColor: const Color(0xFF28303B),
                    foregroundColor: Colors.lightBlueAccent,
                    padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 0),
                    minimumSize: const Size(40, 32),
                  ),
                  onPressed: onTap,
                  child: Text(label, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                ),
              );
            }

            Widget _buildDiagramTab() {
              final steps = _codeController.text.split('\n')
                  .map((e) => e.trim())
                  .where((e) => e.isNotEmpty && !e.startsWith('//'))
                  .toList();

              return SingleChildScrollView(
                padding: const EdgeInsets.all(20),
                child: Center(
                  child: Column(
                    children: steps.map((line) {
                      return Container(
                        margin: const EdgeInsets.symmetric(vertical: 6),
                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                        decoration: BoxDecoration(
                          color: const Color(0xFF1E242C),
                          border: Border.all(color: Colors.blueAccent, width: 1.5),
                          borderRadius: BorderRadius.circular(line.startsWith('Algoritmo') || line.startsWith('FinAlgoritmo') ? 20 : 6),
                        ),
                        child: Text(line, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white, fontSize: 13, fontWeight: FontWeight.bold)),
                      );
                    }).toList(),
                  ),
                ),
              );
            }

            Widget _buildConsoleTab() {
              return Column(
                children: [
                  Container(
                    padding: const EdgeInsets.all(8),
                    color: const Color(0xFF181D24),
                    child: Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        const Text('Terminal de Salida', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white70)),
                        IconButton(
                          icon: const Icon(Icons.delete_sweep_rounded, color: Colors.white70),
                          onPressed: () => setState(() {
                            _consoleLogs.clear();
                            _memoryVariables.clear();
                          }),
                        ),
                      ],
                    ),
                  ),
                  Expanded(
                    child: ListView.builder(
                      padding: const EdgeInsets.all(12),
                      itemCount: _consoleLogs.length,
                      itemBuilder: (context, i) {
                        final log = _consoleLogs[i];
                        final isSys = log['type'] == 'sys';
                        return Container(
                          margin: const EdgeInsets.only(bottom: 6),
                          padding: const EdgeInsets.all(8),
                          decoration: BoxDecoration(
                            color: isSys ? Colors.transparent : const Color(0xFF222832),
                            borderRadius: BorderRadius.circular(4),
                          ),
                          child: Text(
                            log['text']!,
                            style: TextStyle(
                              fontFamily: 'monospace',
                              color: isSys ? Colors.cyanAccent : Colors.white,
                              fontSize: 12.5,
                            ),
                          ),
                        );
                      },
                    ),
                  ),
                ],
              );
            }

            Widget _buildChallengesTab() {
              return ListView.builder(
                padding: const EdgeInsets.all(12),
                itemCount: _savedAlgorithms.length,
                itemBuilder: (context, i) {
                  final item = _savedAlgorithms[i];
                  return Card(
                    color: const Color(0xFF181D24),
                    margin: const EdgeInsets.only(bottom: 10),
                    child: ListTile(
                      title: Text(item['title']!, style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text(item['desc']!, style: const TextStyle(color: Colors.white60, fontSize: 12)),
                      trailing: ElevatedButton(
                        onPressed: () {
                          setState(() {
                            _codeController.text = item['code']!;
                            _tabController.animateTo(0);
                          });
                        },
                        child: const Text('Cargar'),
                      ),
                    ),
                  );
                },
              );
            }
          }
          EOF

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar icono personalizado
        run: |
          if [ -f "app_icon.png" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Compilar APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: pseudocode-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
