name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Crear estructura e instalar librerias
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi
          flutter pub add http pdf printing

      - name: Corregir errores de sintaxis en main.dart
        run: |
          sed -i 's/\.fromSeed/ColorScheme.fromSeed/g' lib/main.dart
          sed -i 's/\.center/MainAxisAlignment.center/g' lib/main.dart

      - name: Compilar APK
        run: flutter build apk --release --extra-front-end-options=--enable-experiment=dot-shorthands

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
